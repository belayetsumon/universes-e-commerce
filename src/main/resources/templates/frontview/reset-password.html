<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="front-layout-inner-page">
    <div layout:fragment="main_content">
        <section class="forgot-page">
            <div class="container">
                <div class="forgot-shell">
                    <aside class="forgot-brand-panel" aria-label="Password reset guidance">
                        <span class="forgot-brand-icon"><i class="bi bi-shield-lock"></i></span>
                        <span class="forgot-eyebrow">Account recovery</span>
                        <h1>Choose a new password</h1>
                        <p>Use a strong password that you do not reuse on another service.</p>
                    </aside>

                    <div class="forgot-form-panel">
                        <div class="forgot-form-header">
                            <span class="forgot-eyebrow">Secure reset</span>
                            <h2>Set your new password</h2>
                            <p>This reset link is single-use and expires shortly.</p>
                        </div>

                        <div class="alert alert-danger forgot-alert" th:if="${error != null}" role="alert">
                            <i class="bi bi-exclamation-octagon"></i>
                            <span th:text="${error}">This password reset link is invalid or has expired.</span>
                        </div>

                        <form class="forgot-form" th:action="@{/forgotpassword/reset}" th:object="${passwordResetForm}" method="post">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="token" th:value="${token}" />

                            <div class="forgot-field">
                                <label for="newPassword">New password</label>
                                <div class="forgot-input-wrap">
                                    <i class="bi bi-key"></i>
                                    <input id="newPassword" type="password" class="form-control"
                                           th:field="*{newPassword}" autocomplete="new-password"
                                           minlength="8" maxlength="72" required="true">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                            </div>

                            <div class="forgot-field">
                                <label for="confirmPassword">Confirm password</label>
                                <div class="forgot-input-wrap">
                                    <i class="bi bi-check2-circle"></i>
                                    <input id="confirmPassword" type="password" class="form-control"
                                           th:field="*{confirmPassword}" autocomplete="new-password"
                                           minlength="8" maxlength="72" required="true">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <button type="submit" class="btn forgot-submit-btn">
                                <i class="bi bi-check2"></i>
                                Reset password
                            </button>
                        </form>

                        <div class="forgot-actions">
                            <a th:href="@{/public/member-login}"><i class="bi bi-arrow-left"></i> Back to login</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</html>
