# Production and remote schemas are migration-controlled.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.collationConnection=utf8_general_ci

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=202608230000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

checkout.idempotency.retention-days=30
checkout.idempotency.stale-grace-minutes=15
checkout.idempotency.cleanup-cron=0 15 3 * * *
checkout.otp.retention-days=30
fraud.retention.velocity-days=7
fraud.retention.outbox-published-days=30
fraud.retention.batch-size=500
fraud.retention.max-batches-per-run=20
fraud.retention.cleanup-cron=0 45 3 * * *

spring.jpa.open-in-view=false
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.log-request-details=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.thymeleaf=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.collationConnection=utf8mb4_unicode_ci

storage.root-path=/opt/tomcat/universesecommerce
