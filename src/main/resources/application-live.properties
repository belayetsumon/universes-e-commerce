# MySQL 8 deployment profile using the checked-in normal connection defaults.
spring.data.jpa.repositories.enabled=true
spring.datasource.url=jdbc:mysql://localhost:3306/universes_ecommercenew?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=202608230000
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

checkout.idempotency.retention-days=30
checkout.idempotency.stale-grace-minutes=15
checkout.idempotency.cleanup-cron=0 15 3 * * *
checkout.otp.retention-days=30
fraud.retention.velocity-days=7
fraud.retention.outbox-published-days=30
fraud.retention.batch-size=500
fraud.retention.max-batches-per-run=20
fraud.retention.cleanup-cron=0 45 3 * * *

spring.jpa.open-in-view=false
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.log-request-details=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.thymeleaf=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Live Tomcat file storage root.
storage.root-path=/opt/tomcat/universesecommerce
